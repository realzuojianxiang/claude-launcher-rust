<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f2f7" />
    <title>Claude Launcher</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #f2f2f7;
      }

      .boot-screen {
        width: 100%;
        height: 100%;
        display: grid;
        place-content: center;
        gap: 10px;
        color: #1c1c1e;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      .boot-screen-logo {
        font-size: 34px;
        line-height: 1;
      }

      .boot-screen-title {
        font-size: 16px;
        font-weight: 650;
      }

      .boot-screen-status {
        color: #8e8e93;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-label="Claude Launcher 正在启动">
        <div class="boot-screen-logo" aria-hidden="true">🚀</div>
        <div class="boot-screen-title">Claude Launcher</div>
        <div class="boot-screen-status">正在启动…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
