<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>Claude Launcher</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #f2f2f7;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background: #000000;
        }
      }

      .boot-screen {
        width: 100%;
        height: 100%;
        display: grid;
        place-content: center;
        gap: 10px;
        color: #1c1c1e;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        .boot-screen {
          color: #f5f5f7;
        }
      }

      .boot-screen-logo {
        width: 32px;
        height: 32px;
        margin: 0 auto;
      }

      .boot-screen-title {
        font-size: 16px;
        font-weight: 600;
      }

      .boot-screen-status {
        color: #636366;
        font-size: 12px;
      }

      @media (prefers-color-scheme: dark) {
        .boot-screen-status {
          color: #aeaeb2;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-label="Claude Launcher 正在启动">
        <img
          class="boot-screen-logo"
          src="/src-tauri/icons/32x32.png"
          alt="Claude Launcher"
        />
        <div class="boot-screen-title">Claude Launcher</div>
        <div class="boot-screen-status">正在启动…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
