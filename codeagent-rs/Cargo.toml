[package]
name = "codeagent"
version = "0.1.0"
edition = "2021"
# 造自己的 code agent —— 学习用,从 P0 (单轮问答) 开始迭代。
# 见仓库根 docs/codeagent-journey.md 的路线图。
# 与 rust/ (Claude Launcher) 完全独立,互不依赖。

[dependencies]
# 异步运行时:agent loop 的每一轮 (调模型 / 执行工具) 都是非阻塞的,
# P5 流式用的是 reqwest::Response::bytes_stream() + tokio::select! 中断:
#   · "signal" 给 Ctrl-C 中断 (Windows/Unix 通用 tokio::signal::ctrl_c);
#   · "macros" 给 #[tokio::main],rt-multi-thread 给 worker 池。
# P8 加 "process" / "io-util":subagent 起子进程 (tokio::process::Command + Stdio::piped
#   + ChildStdin/ChildStdout)、MCP stdio 客户端逐行读子进程 stdout (BufReader::read_line),
#   都要这两个 feature。process 还带 Windows 子进程迁移语义,stdout 回灌靠 io-util 的 AsyncReadExt。
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "io-util"] }
# HTTP 客户端:调 DeepSeek (OpenAI 兼容) 接口。
# rustls-tls 不依赖系统 OpenSSL,和 rust/src-tauri 的选择保持一致。
# P5 流式:`stream` feature 开启 Response::bytes_stream()(SSE 增量字节流);
#           其余 reqwest 内部依赖 futures-core/futures-util 已由此 feature 拉入,
#           但我要在代码里 use futures_util::StreamExt,故下面仍显式引 futures-util。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# P5 流式:bytes_stream 返回的 Stream 要 .next() 需 StreamExt 在作用域。
# 只引 futures-util(不引 futures 全家桶),体积最小,仅用 StreamExt 这一个 trait。
futures-util = "0.3"
# 序列化:messages / 请求体 / 响应体。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# P0.5: 配置文件格式。多 provider(base_url/model/key)抽到 TOML,
# 换供应商=换配置不改代码。serde 派生解析,human-readable 好改。
toml = "0.8"
# agent loop 错误源多(网络/JSON/工具执行),anyhow 的 ? + .context() 注入
# 调试上下文,从 P1 起会反复用到。体积小、零不必要依赖。
anyhow = "1"
# P5.5 REPL 行编辑:rustyline 替掉裸 io::stdin().read_line —— 行编辑(光标移动/删除)、
# ↑↓ 命令历史、Ctrl-C 取消当前行(ReadlineError::Interrupted,非退出)、EOF 退 REPL。
# 只引主 crate,历史落盘用其自带的 FileHistory(不需单独 rustyline-derive 之类)。
# 注:rustyline 接管 readline 期间的 raw mode;Ctrl-C 在它那层转成 Interrupted,
# 与 P5 的 mpsc 流式中断职责不撞(readline 时没在生成,生成时没在 readline)。
rustyline = "18"
# P6.1:Summarizer trait 的 summarize 是 async 方法,要用 `dyn Summarizer` 调它(测试注入
# FakeSummarizer vs 运行期注入 ModelSummarizer 共用一个 trait 对象),得 async-trait 把
# async fn desugar 成返回 Pin<Box<dyn Future>>。体积极小、社区通用,无独立运行时成本。
async-trait = "0.1"

# (a) trait async 升级 Phase A 验证 keystone —— 一个极窄纯标准库 JSON-RPC 2.0 stdio echo server,
# 被 tests/mcp_fake_handshake.rs 用 env!("CARGO_BIN_EXE_codeagent_mcp_fake_server") 起成子进程,
# 跑真 McpClient::spawn→handshake→list_tools→call_tool 全链(无真 key/npx/网络)。
# 独立 [[bin]] 而非 codeagent 隐藏 subcommand:保主 CLI --help/arg 面干净,cargo 也只为 [[bin]]
# 给集成测试设 CARGO_BIN_EXE_<name>(src 内 #[test] 不设)。
[[bin]]
name = "codeagent-mcp-fake-server"
path = "src/bin/mcp_fake_server.rs"
